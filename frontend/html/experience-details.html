<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<title>جزئیات تجربه</title>

<link rel="stylesheet" href="/css/exprience_details.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

  <div id="header-container"></div>


<section class="experience-hero">

<div class="hero-inner">

<h1 id="expTitle"></h1>

<div class="hero-company">

<i class="fas fa-building"></i>
<span id="expCompany"></span>

</div>

<div class="hero-rating">

<div class="rating-circle" id="expRating"></div>

<span>امتیاز کلی تجربه</span>

</div>

</div>

</section>



<div class="container">

<div class="experience-layout">


<div class="experience-main">

<div class="glass-card detail-card">

<h3>توضیحات تجربه</h3>

<p id="expDescription"></p>

</div>

</div>



<div class="experience-sidebar">

<div class="glass-card info-card">

<h4>اطلاعات تجربه</h4>

<div class="info-item">
<span>شرکت</span>
<strong id="infoCompany"></strong>
</div>

<div class="info-item">
<span>تاریخ شروع</span>
<strong id="infoStart"></strong>
</div>

<div class="info-item">
<span>تاریخ پایان</span>
<strong id="infoEnd"></strong>
</div>

<div class="info-item">
<span>مدت</span>
<strong id="infoDuration"></strong>
</div>

</div>
</div>
</div>
</div>


  <div id="footer-container"></div>
    
  <script src="/js/layout-loader.js"></script>
<script src="/js/experience-details.js"></script>

</body>
</html>
