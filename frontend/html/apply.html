<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال درخواست همکاری | اینترنو</title>
    <link rel="stylesheet" href="/css/apply.css">
</head>
<body>

    <div id="header-container"></div>

    <main class="main-content">

        <div class="apply-container">
            <h2>فرم درخواست همکاری</h2>

            <form id="applyForm">
                <input type="hidden" id="jobId">

                <div class="form-group">
                    <label for="fullName">نام و نام خانوادگی</label>
                    <input type="text" id="fullName" placeholder="مثال: علی علوی" required>
                </div>

                <div class="form-group">
                    <label for="email">ایمیل ارتباطی</label>
                    <input type="email" id="email" placeholder="example@domain.com" style="direction: ltr; text-align: right;" required>
                </div>

                <div class="form-group">
                    <label for="phone">شماره تماس</label>
                    <input type="tel" id="phone" placeholder="۰۹۱۲۳۴۵۶۷۸۹" style="direction: ltr; text-align: right;" required>
                </div>

                <div class="form-group">
                    <label for="coverLetter">کاور لتر (توضیحات اختیاری)</label>
                    <textarea id="coverLetter" rows="5" placeholder="کمی از انگیزه‌ها و مهارت‌های برجسته خود بنویسید..."></textarea>
                </div>

                <button type="submit">ارسال درخواست همکاری</button>
            </form>
        </div>

    </main>

    <div id="footer-container"></div>

    <script src="/js/layout-loader.js"></script>
    <script src="/js/apply.js"></script>
</body>
</html>
